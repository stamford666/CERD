[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerd-multimodal"
version = "0.1.0"
description = "Missingness-aware generative reliability mixture-of-experts for multimodal classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.0",
  "tqdm>=4.65",
  "pyarrow>=12",
  "anndata>=0.10",
  "dm-tree>=0.1.8",
]

[tool.setuptools.packages.find]
include = ["cerd*"]

[project.optional-dependencies]
test = ["pytest>=7.4"]
