name: Release results gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-release-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install release-gate test dependencies
        run: python -m pip install "pytest>=7.4" "numpy>=1.24" "scikit-learn>=1.3"
      - name: Run release-contract tests
        run: python -m pytest -q tests/test_final_result_builder.py tests/test_release_results.py tests/test_output_contract.py
      - name: Require approved, complete, synchronized public results
        run: python scripts/render_release_results.py --input results/final_results.json --check --require-final
