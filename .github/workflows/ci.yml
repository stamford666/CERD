name: validate-paper-package

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate manuscript package
        run: |
          test -s cas-sc-sample.tex
          test -s cas-sc-sample.pdf
          test -s CERD_LaTeX_current.zip
          unzip -t CERD_LaTeX_current.zip
